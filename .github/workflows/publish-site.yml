name: Check and publish animated chronicle
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/check-site.mjs", ".github/workflows/publish-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: animated-chronicle-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Install browser checks on hosted runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check desktop, mobile, reduced motion and interactions
        run: node scripts/check-site.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-review
          path: site-checks/
          retention-days: 14
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
